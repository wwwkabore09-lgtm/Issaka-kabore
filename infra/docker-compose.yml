services:
  postgres:
    image: postgres:16-alpine
    container_name: finza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finza
      POSTGRES_PASSWORD: finza
      POSTGRES_DB: finza
    ports:
      - "5432:5432"
    volumes:
      - finza-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: finza-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - finza-redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: finza-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: finza
      MINIO_ROOT_PASSWORD: finza123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - finza-minio-data:/data

volumes:
  finza-postgres-data:
  finza-redis-data:
  finza-minio-data:
