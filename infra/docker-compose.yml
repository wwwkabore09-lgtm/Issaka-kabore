services:
  postgres:
    image: postgres:16-alpine
    container_name: finza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finza
      POSTGRES_PASSWORD: finza
      POSTGRES_DB: finza
    ports:
      - "5432:5432"
    volumes:
      - finza-postgres-data:/var/lib/postgresql/data

volumes:
  finza-postgres-data:
